[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nds-bot"
version = "0.1.0"
description = "Event-driven trading engine using cTrader Open API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ctrader-open-api==0.9.2",
    "python-dotenv>=1.0,<2",
    "service-identity[idna]>=24,<27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["nds_bot"]